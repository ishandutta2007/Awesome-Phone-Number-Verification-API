<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
    .pulse-circle { animation: pulse 3s infinite alternate; transform-origin: center; }
    .wave-line { stroke: url(#textGrad); stroke-dasharray: 10 5; animation: dash 20s linear infinite; }
    @keyframes pulse { 0% { transform: scale(0.98); opacity: 0.7; } 100% { transform: scale(1.02); opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid & Graphics -->
  <g opacity="0.15">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 200,0 L 200,300 M 400,0 L 400,300 M 600,0 L 600,300 M 800,0 L 800,300 M 1000,0 L 1000,300" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Abstract Phone / Shield Verification Graphic -->
  <g transform="translate(950, 150)" class="pulse-circle">
    <circle r="90" fill="url(#accentGrad)" opacity="0.2" filter="url(#glow)"/>
    <circle r="65" stroke="url(#textGrad)" stroke-width="3" fill="none"/>
    <path d="M-25,-35 L25,-35 L25,35 L-25,35 Z" rx="6" stroke="#38bdf8" stroke-width="3" fill="#0f172a"/>
    <path d="M-12,-10 L-2,5 L16,-15" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    <circle cx="0" cy="24" r="3" fill="#38bdf8"/>
  </g>

  <g transform="translate(100, 0)">
    <!-- Animated status badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="71" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="76" class="tag">VERIFICATION ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Awesome Phone Number Verification API</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS Platforms, Telecom HLR Lookup APIs &amp; Open-Source Libraries</text>

    <!-- Tech Badges inside SVG -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#334155"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">📱 E.164 Parsing</text>

      <rect x="142" y="0" width="140" height="28" rx="6" fill="#334155"/>
      <text x="154" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">📡 HLR / Carrier ID</text>

      <rect x="294" y="0" width="150" height="28" rx="6" fill="#334155"/>
      <text x="306" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">🛡️ Fraud Prevention</text>

      <rect x="456" y="0" width="130" height="28" rx="6" fill="#334155"/>
      <text x="468" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">⚡ Open-Source</text>
    </g>
  </g>
</svg>
